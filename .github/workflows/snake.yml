name: 贪吃蛇提交图

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#000000&color_dots=#eeeeee,#c4c4c4,#8a8a8a,#4a4a4a,#111111
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#111111,#2a2a2a,#555555,#999999,#eeeeee
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
