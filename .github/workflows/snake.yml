name: 贪吃蛇提交图

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#f2a98f&color_dots=#ebedf0,#b7e4c7,#8fd3d6,#f8c27e,#f2a98f
            dist/snake-dark.svg?palette=github-dark&color_snake=#f8c27e&color_dots=#161b22,#173441,#2f6b78,#8fd3d6,#f2a98f
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
