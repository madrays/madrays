<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="madrays">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a22"/>
      <stop offset="0.55" stop-color="#142c38"/>
      <stop offset="1" stop-color="#1b3a47"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a98f"/>
      <stop offset="0.5" stop-color="#f8c27e"/>
      <stop offset="1" stop-color="#8fd3d6"/>
      <animate attributeName="x1" values="0;-1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2a98f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2a98f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd3d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fd3d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8fd3d6" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .t{font-family:"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
      .m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
      .bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.6s ease-in-out infinite}
      @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
      .line{opacity:0;animation:cycle 12s infinite}
      .l2{animation-delay:4s}.l3{animation-delay:8s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:fl 10s ease-in-out infinite}
      .float2{animation:fl 13s ease-in-out infinite reverse}
      @keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
      .rise{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="float" cx="980" cy="90" r="260" fill="url(#glowA)"/>
    <circle class="float2" cx="260" cy="360" r="280" fill="url(#glowB)"/>

    <!-- equalizer -->
    <g transform="translate(760 92)" opacity="0.9">
      <g fill="url(#ink)">
        <rect class="bar" x="0"   y="0" width="14" height="200" rx="7" style="animation-delay:-.1s"/>
        <rect class="bar" x="26"  y="0" width="14" height="200" rx="7" style="animation-delay:-.7s"/>
        <rect class="bar" x="52"  y="0" width="14" height="200" rx="7" style="animation-delay:-.3s"/>
        <rect class="bar" x="78"  y="0" width="14" height="200" rx="7" style="animation-delay:-1.1s"/>
        <rect class="bar" x="104" y="0" width="14" height="200" rx="7" style="animation-delay:-.5s"/>
        <rect class="bar" x="130" y="0" width="14" height="200" rx="7" style="animation-delay:-1.4s"/>
        <rect class="bar" x="156" y="0" width="14" height="200" rx="7" style="animation-delay:-.2s"/>
        <rect class="bar" x="182" y="0" width="14" height="200" rx="7" style="animation-delay:-.9s"/>
        <rect class="bar" x="208" y="0" width="14" height="200" rx="7" style="animation-delay:-.4s"/>
        <rect class="bar" x="234" y="0" width="14" height="200" rx="7" style="animation-delay:-1.2s"/>
        <rect class="bar" x="260" y="0" width="14" height="200" rx="7" style="animation-delay:-.6s"/>
        <rect class="bar" x="286" y="0" width="14" height="200" rx="7" style="animation-delay:-1s"/>
        <rect class="bar" x="312" y="0" width="14" height="200" rx="7" style="animation-delay:-.15s"/>
        <rect class="bar" x="338" y="0" width="14" height="200" rx="7" style="animation-delay:-.8s"/>
      </g>
      <rect x="-10" y="212" width="372" height="2" rx="1" fill="#8fd3d6" opacity="0.25"/>
    </g>

    <!-- text -->
    <g class="rise">
      <text x="72" y="96" class="m" font-size="18" fill="#8fd3d6" letter-spacing="3">~/madrays $ whoami</text>
      <text x="68" y="196" class="t" font-size="104" font-weight="800" fill="url(#ink)" letter-spacing="-3">madrays</text>
    </g>

    <g class="t" font-size="26" fill="#e8f1f2">
      <text class="line l1" x="72" y="252">NAS 折腾党，给自托管服务写插件和小工具</text>
      <text class="line l2" x="72" y="252">让小爱音箱放 NAS 里的歌 · TrackFerry</text>
      <text class="line l3" x="72" y="252">Sun-Panel 美化 · MoviePilot 插件 · NexusPHP 插件</text>
    </g>

    <g class="m" font-size="16" fill="#9fb8bf">
      <text x="72" y="318">Go · TypeScript · Python · Vue · PHP</text>
      <text x="72" y="344" fill="#f8c27e">→ madrays.de<tspan class="cur" fill="#f2a98f">▍</tspan></text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="22" fill="none" stroke="#8fd3d6" stroke-opacity="0.18"/>
</svg>
