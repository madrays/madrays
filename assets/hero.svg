<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="MADRAYS">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="400"/></clipPath>
    <style>
      .s{font-family:"Inter","SF Pro Display","Helvetica Neue","PingFang SC",Arial,sans-serif}
      .m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
      .scan{animation:sc 7s linear infinite}
      @keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .tick{animation:t 2.4s ease-in-out infinite}
      @keyframes t{0%,100%{opacity:.15}50%{opacity:.9}}
      .wave{stroke-dasharray:1400;stroke-dashoffset:1400;animation:w 6s ease-in-out infinite}
      @keyframes w{0%{stroke-dashoffset:1400}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-1400}}
    </style>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="400" fill="#050505"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <rect class="scan" x="0" y="0" width="300" height="400" fill="url(#scan)"/>

    <!-- frame -->
    <g stroke="#fff" stroke-opacity="0.9" stroke-width="1.5" fill="none">
      <path d="M40 64V40H64"/><path d="M1136 40H1160V64"/>
      <path d="M40 336V360H64"/><path d="M1136 360H1160V336"/>
    </g>
    <line x1="80" y1="40" x2="1120" y2="40" stroke="#fff" stroke-opacity="0.08"/>
    <line x1="80" y1="360" x2="1120" y2="360" stroke="#fff" stroke-opacity="0.08"/>

    <!-- top meta -->
    <g class="m" font-size="12" fill="#8a8a8a" letter-spacing="2">
      <text x="80" y="82">ID / MADRAYS</text>
      <text x="1120" y="82" text-anchor="end">SYS.ONLINE <tspan class="blink" fill="#fff">●</tspan></text>
    </g>

    <!-- name -->
    <text x="76" y="218" class="s" font-size="132" font-weight="800" fill="#fff" letter-spacing="-4">MADRAYS</text>
    <rect x="80" y="244" width="56" height="3" fill="#fff"/>

    <g class="m" font-size="15" fill="#bdbdbd" letter-spacing="1">
      <text x="80" y="284">SELF-HOSTED  /  NAS  /  AUDIO  /  AUTOMATION</text>
    </g>

    <!-- signal -->
    <g transform="translate(780 112)">
      <path class="wave" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"
        d="M0 60 H40 L52 60 L60 20 L70 100 L80 40 L88 76 L96 60 H130 L138 60 L146 0 L156 120 L166 30 L174 84 L182 60 H230 L240 60 L248 36 L258 90 L268 46 L276 70 L284 60 H340"/>
      <line x1="0" y1="60" x2="340" y2="60" stroke="#fff" stroke-opacity="0.12"/>
      <g class="m" font-size="11" fill="#6a6a6a" letter-spacing="2">
        <text x="0" y="150">FREQ</text><text x="120" y="150">GAIN</text><text x="240" y="150">PHASE</text>
        <text x="0" y="168" fill="#fff">44.1K</text><text x="120" y="168" fill="#fff">-3.0dB</text><text x="240" y="168" fill="#fff">0.00</text>
      </g>
    </g>

    <!-- bottom ruler -->
    <g fill="#fff">
      <rect class="tick" x="80"  y="318" width="2" height="14" style="animation-delay:0s"/>
      <rect class="tick" x="96"  y="322" width="2" height="10" style="animation-delay:.2s"/>
      <rect class="tick" x="112" y="322" width="2" height="10" style="animation-delay:.4s"/>
      <rect class="tick" x="128" y="322" width="2" height="10" style="animation-delay:.6s"/>
      <rect class="tick" x="144" y="318" width="2" height="14" style="animation-delay:.8s"/>
    </g>
    <g class="m" font-size="12" fill="#8a8a8a" letter-spacing="2">
      <text x="168" y="331">MADRAYS.DE</text>
      <text x="1120" y="331" text-anchor="end">GO · TS · PY · VUE · PHP</text>
    </g>
  </g>
</svg>
